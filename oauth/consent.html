<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1109">
<title>Sporely – Authorize</title>
<link rel="icon" type="image/png" href="/icon-192-v3.png">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: #0d1109;
  color: #e8ede6;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
.consent-card {
  width: 100%;
  max-width: 360px;
  background: #131a10;
  border: 1px solid #2a3426;
  border-radius: 16px;
  padding: 32px 28px;
  text-align: center;
}
.consent-icon {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  margin-bottom: 20px;
}
.consent-app-name {
  font-size: 18px;
  font-weight: 700;
  color: #e8ede6;
  margin: 0 0 4px;
}
.consent-message {
  font-size: 15px;
  color: #9aab96;
  margin: 0 0 20px;
  line-height: 1.4;
}
.consent-user-row {
  font-size: 13px;
  color: #6b7c67;
  margin-bottom: 24px;
  padding: 10px 12px;
  background: #0d1109;
  border-radius: 8px;
}
.consent-user-email { color: #9aab96; font-weight: 500; }
.consent-btn {
  display: block;
  width: 100%;
  padding: 13px 20px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  margin-bottom: 10px;
}
.consent-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.consent-btn-approve { background: #4c7a3a; color: #fff; }
.consent-btn-approve:hover:not(:disabled) { background: #5a8e46; }
.consent-btn-deny { background: transparent; color: #9aab96; border: 1px solid #2a3426; }
.consent-btn-deny:hover:not(:disabled) { background: #1a2417; }
#consent-loading { color: #6b7c67; font-size: 15px; padding: 20px 0; }
#consent-error {
  display: none;
  color: #d4675b;
  font-size: 14px;
  line-height: 1.5;
  padding: 16px 12px;
  background: #1e1109;
  border-radius: 8px;
  text-align: left;
}
#consent-ui { display: none; }
</style>
</head>
<body>
<div class="consent-card">
  <div id="consent-loading">Loading…</div>
  <div id="consent-error"></div>
  <div id="consent-ui">
    <img class="consent-icon" src="/icon-192-v3.png" alt="">
    <div id="consent-client-name" class="consent-app-name">Sporely Desktop</div>
    <p class="consent-message">wants to connect to your Sporely account.</p>
    <div class="consent-user-row">
      Signed in as <span id="consent-user-email" class="consent-user-email"></span>
    </div>
    <button id="consent-approve" class="consent-btn consent-btn-approve">Continue to Sporely Desktop</button>
    <button id="consent-deny" class="consent-btn consent-btn-deny">Cancel</button>
  </div>
</div>
<script type="module" src="./consent.js"></script>
</body>
</html>
