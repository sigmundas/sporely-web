<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sporely CAPTCHA</title>
  <!--
    Route-scoped CSP is also enforced via Cloudflare Pages headers
    (public/_headers). The meta tag is defense in depth — the header
    version wins where they differ.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self' https://challenges.cloudflare.com;
    frame-src https://challenges.cloudflare.com;
    connect-src https://challenges.cloudflare.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    base-uri 'none';
    form-action 'none';
  ">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0d1109;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    #widget {
      display: flex;
      justify-content: center;
    }
    #status {
      color: #aaa;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 1.4em;
    }
    .wrap { max-width: 320px; width: 100%; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="wrap">
    <div id="widget"></div>
    <div id="status">Loading…</div>
  </div>
  <script type="module" src="./turnstile-mobile.js"></script>
</body>
</html>
