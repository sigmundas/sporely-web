name = "sporely-r2-upload"
main = "src/index.js"
compatibility_date = "2026-04-10"

[[routes]]
pattern = "upload.sporely.no"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sporely-media"

# Stage 2 private media bucket. Uncomment and provision at Stage 2c cutover.
# See `docs/security/stage-2-media-authorization.md`.
#
# The bucket MUST be created with `custom_domain = false` and no public-dev
# URL. New canonical uploads go here; legacy objects are backfilled from
# `sporely-media`. During transition both bindings coexist.
#
# [[r2_buckets]]
# binding = "PRIVATE_MEDIA_BUCKET"
# bucket_name = "sporely-media-private"

[vars]
MEDIA_STORAGE_MODE = "legacy"
SUPABASE_URL = "https://zkpjklzfwzefhjluvhfw.supabase.co"
SUPABASE_JWT_AUDIENCE = "authenticated"
MEDIA_PUBLIC_BASE_URL = "https://media.sporely.no"
ALLOWED_ORIGINS = "https://app.sporely.no,https://sporely.no,https://www.sporely.no,https://localhost:5173,http://localhost:5173,https://localhost,capacitor://localhost"
MAX_UPLOAD_BYTES = "15728640"
# Optional free-tier account quota. Set 0 to rely only on per-profile storage_quota_bytes.
FREE_STORAGE_QUOTA_BYTES = "0"

# Optional overrides:
# SUPABASE_JWT_ISSUER = "https://zkpjklzfwzefhjluvhfw.supabase.co/auth/v1"
# SUPABASE_JWKS_URL = "https://zkpjklzfwzefhjluvhfw.supabase.co/auth/v1/.well-known/jwks.json"
# JWT_CLOCK_SKEW_SECONDS = "60"

# Optional secrets:
# wrangler secret put SUPABASE_JWT_SECRET
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY

# Required secret for Artsorakel identification (POST /artsorakel and
# POST /artsorakel/media). Do NOT place the token under [vars].
# npx wrangler secret put ARTSORAKEL_API_TOKEN
